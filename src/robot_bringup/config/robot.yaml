base_driver:
  ros__parameters:
    max_linear_speed: 0.6
    max_angular_speed: 1.5
    command_timeout: 0.5
    publish_rate: 50.0
    odom_frame: odom
    base_frame: base_footprint

velocity_safety:
  ros__parameters:
    max_linear_speed: 0.6
    max_angular_speed: 1.5
    command_timeout: 0.5
    publish_rate: 50.0

point_controller:
  ros__parameters:
    linear_gain: 0.8
    angular_gain: 2.0
    max_linear_speed: 0.45
    max_angular_speed: 1.2
    position_tolerance: 0.08
    control_rate: 20.0
    odom_timeout: 0.5
    goal_frame: odom
    yaw_tolerance: 0.05
    max_linear_accel: 0.8
    max_linear_decel: 1.2
    max_angular_accel: 2.0
    max_angular_decel: 3.0
    command_smoothing_alpha: 0.35
    max_odom_jump: 1.0
    odom_filter_alpha: 0.35
    allow_reverse: false

task_manager:
  ros__parameters:
    auto_start: false
    resume_on_start: false
    frame_id: odom
    waypoint_timeout: 60.0
    max_retries: 2
    skip_on_failure: false
    battery_threshold: 0.20
    state_file: /tmp/robot_task_state
    waypoint_x: [1.0, 1.0, 0.0]
    waypoint_y: [0.0, 1.0, 0.0]
